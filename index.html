<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jabalises Bikers</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{box-sizing:border-box}

body{
margin:0;
background:#07111f;
color:white;
font-family:Arial;
}

.container{
max-width:1400px;
margin:auto;
padding:30px;
}

.top{
display:flex;
gap:20px;
align-items:center;
margin-bottom:25px;
}

.profile{
width:300px;
background:#111827;
padding:25px;
border-radius:20px;
text-align:center;
}

.avatar{
width:90px;
height:90px;
border-radius:50%;
margin:auto;
background:
linear-gradient(
135deg,
#f97316,
#facc15
);

display:flex;
align-items:center;
justify-content:center;

font-size:38px;

font-weight:bold;

color:#111827;

}

.badge{
margin-top:12px;
display:inline-block;
padding:8px 12px;
border-radius:999px;
border:1px solid #f97316;
color:#f97316;
}

.level{
font-size:30px;
color:#22c55e;
font-weight:bold;
}

.points{
font-size:24px;
}

.hero{
flex:1;
background:#111827;
padding:30px;
border-radius:20px;
}

.cards{
display:grid;
grid-template-columns:
repeat(
4,
1fr
);

gap:16px;

margin-top:20px;

}

.card{

background:#111827;

padding:22px;

border-radius:18px;

}

.value{

font-size:36px;

font-weight:bold;

margin-top:10px;

}

.grid{

display:grid;

grid-template-columns:
2fr 1fr;

gap:20px;

margin-top:20px;

}

.panel{

background:#111827;

padding:22px;

border-radius:18px;

}

.activity{

display:flex;

justify-content:space-between;

padding:14px 0;

border-bottom:
1px solid
#1f2937;

}

.small{
color:#94a3b8;
}

.green{
color:#22c55e;
}

.orange{
color:#f97316;
}

.gold{
color:#facc15;
}

@media(max-width:900px){

.cards{
grid-template-columns:
1fr 1fr;
}

.top,
.grid{

display:block;

}

.profile{

width:auto;

margin-bottom:20px;

}

}

</style>

</head>

<body>

<div class="container">

<div class="top">

<div class="profile">

<div
id="avatar"
class="avatar">

J

</div>

<h2
id="displayName">

Jabalí

</h2>

<div
id="badge"
class="badge">

Gran Jabalí

</div>

<div
id="level"
class="level">

Nivel 1

</div>

<div
id="profilePoints"
class="points">

0 pts

</div>

</div>

<div class="hero">

<h1>

🏆 Dashboard

</h1>

<p
id="welcome"
class="small">

Cargando...

</p>

<button
onclick="loadDashboard()">

Actualizar

</button>

</div>

</div>

<div class="cards">

<div class="card">

🏆

<div
id="points"
class="value gold">

0

</div>

<p class="small">

puntos

</p>

</div>

<div class="card">

🚴

<div
id="activities"
class="value">

0

</div>

<p class="small">

salidas

</p>

</div>

<div class="card">

📍

<div
id="km"
class="value">

0

</div>

<p class="small">

km

</p>

</div>

<div class="card">

⛰️

<div
id="elevation"
class="value orange">

0

</div>

<p class="small">

desnivel

</p>

</div>

</div>

<div class="grid">

<div>

<div class="panel">

<h2>

🚴 Actividades recientes

</h2>

<div
id="recent">

</div>

</div>

</div>

<div>

<div class="panel">

<h2>

🐗 Podio

</h2>

<p class="gold">

🥇 Gran Jabalí

</p>

<p>

🥈 Colmillo de Plata

</p>

<p>

🥉 Pezuña de Hierro

</p>

</div>

</div>

</div>

</div>

<script>

const SUPABASE_URL=
"https://bktwylokqyjuoernembh.supabase.co";

const SUPABASE_KEY=
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJrdHd5bG9rcXlqdW9lcm5lbWJoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2NjAyMTAsImV4cCI6MjA5NTIzNjIxMH0.1AEpUCfoGn7-KYIU8tcQhmfLvd5Go6KyIBXTdp-9_vM";

const supabase=
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

async function loadDashboard(){

try{

const profile=
await supabase

.from(
"profile_dashboard"
)

.select(
"*"
)

.limit(
1
);

if(
profile.data?.length
){

const p=
profile.data[0];

document
.getElementById(
"avatar"
)
.innerText=
(
p.display_name||
"J"
)[0];

document
.getElementById(
"displayName"
)
.innerText=
"🐗 "+
p.display_name;

document
.getElementById(
"badge"
)
.innerText=
"🏆 "+
p.badge;

document
.getElementById(
"level"
)
.innerText=
"🔥 Nivel "+
p.level;

document
.getElementById(
"profilePoints"
)
.innerText=
"⭐ "+
p.total_points+
" pts";

document
.getElementById(
"welcome"
)
.innerText=
"Bienvenido "+
p.display_name;

}

const ranking=
await supabase

.from(
"weekly_ranking"
)

.select(
"*"
)

.limit(
1
);

if(
ranking.data?.length
){

const r=
ranking.data[0];

document
.getElementById(
"points"
)
.innerText=
r.total_points;

document
.getElementById(
"activities"
)
.innerText=
r.activities;

document
.getElementById(
"km"
)
.innerText=
r.total_km;

document
.getElementById(
"elevation"
)
.innerText=
r.total_elevation;

}

const recent=
await supabase

.from(
"recent_activities"
)

.select(
"*"
);

let html="";

recent.data?.forEach(
(a)=>{

html+=`

<div class="activity">

<div>

<strong>

${a.name}

</strong>

<br>

<span class="small">

${a.distance_km}
km

</span>

</div>

<div>

🏆
${a.points}

</div>

</div>

`;

}

);

document
.getElementById(
"recent"
)
.innerHTML=
html;

}

catch(e){

document
.getElementById(
"welcome"
)
.innerText=
e.message;

}

}

loadDashboard();

</script>

</body>

</html>
