<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jabalises Bikers</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at top,#17233d,#07111f 60%);color:white;font-family:Arial;padding:22px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;gap:12px}
h1{margin:0;color:#f97316}
button{background:#f97316;color:white;border:0;border-radius:14px;padding:14px 20px;font-weight:bold}
.status,.small{color:#94a3b8}
.card{background:#111827;border:1px solid #1f2937;border-radius:24px;padding:22px;margin-bottom:16px}
.king{border:2px solid #facc15;text-align:center}
.avatar{width:90px;height:90px;border-radius:50%;margin:auto;background:linear-gradient(135deg,#f97316,#facc15);color:#111827;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:bold}
.value{font-size:44px;font-weight:bold;color:#22c55e}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.row{display:flex;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid #1f2937}
.gold{color:#facc15}.silver{color:#cbd5e1}.bronze{color:#fb923c}.green{color:#22c55e}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.strava{background:#fc4c02}
@media(min-width:900px){.layout{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}.grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>

<body>

<div class="header">
  <div>
    <h1>🐗 Jabalises Bikers</h1>
    <div id="status" class="status">Preparado</div>
  </div>
  <div class="actions">
    <button class="strava" onclick="connectStrava()">🚴 Conectar Strava</button>
    <button onclick="loadDashboard()">🔄 Actualizar</button>
  </div>
</div>

<div class="layout">
  <div>
    <div id="kingCard" class="card king">
      <h2>👑 Gran Jabalí de la semana</h2>
      <div id="kingAvatar" class="avatar">J</div>
      <h2 id="kingName">Cargando...</h2>
      <div id="kingPoints" class="value">0</div>
      <p id="kingStats" class="small">Esperando datos</p>
    </div>

    <div class="grid">
      <div class="card">🏆<div id="points" class="value">0</div><p class="small">Puntos</p></div>
      <div class="card">🚴<div id="activities" class="value">0</div><p class="small">Salidas</p></div>
      <div class="card">📍<div id="km" class="value">0</div><p class="small">Km</p></div>
      <div class="card">⛰️<div id="elevation" class="value">0</div><p class="small">Desnivel</p></div>
    </div>

    <div class="card">
      <h2>🏆 Clasificación semanal</h2>
      <div id="rankingList">Cargando ranking...</div>
    </div>
  </div>

  <div>
    <div class="card">
      <h2>🐗 Podio Jabalí</h2>
      <div id="podium">Cargando podio...</div>
    </div>

    <div class="card">
      <h2>🚴 Actividades recientes</h2>
      <div id="recent">Cargando actividades...</div>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://bktwylokqyjuoernembh.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJrdHd5bG9rcXlqdW9lcm5lbWJoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2NjAyMTAsImV4cCI6MjA5NTIzNjIxMH0.1AEpUCfoGn7-KYIU8tcQhmfLvd5Go6KyIBXTdp-9_vM";
const FUNCTION_URL = "https://bktwylokqyjuoernembh.supabase.co/functions/v1/strava-auth";
const STRAVA_CLIENT_ID = "250583";

const REDIRECT_URL = "https://jarranz79-hue.github.io/Jabalises-Bikers/";

async function readTable(table){
  const response = await fetch(
    SUPABASE_URL + "/rest/v1/" + table + "?select=*",
    {
      headers:{
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY
      }
    }
  );

  const text = await response.text();

  if(!response.ok){
    throw new Error(table + " → " + text);
  }

  return JSON.parse(text);
}

function connectStrava(){
  const url =
    "https://www.strava.com/oauth/authorize" +
    "?client_id=" + STRAVA_CLIENT_ID +
    "&response_type=code" +
    "&redirect_uri=" + encodeURIComponent(REDIRECT_URL) +
    "&approval_prompt=force" +
    "&scope=read,activity:read_all";

  window.location.href = url;
}

async function importFromStrava(code){
  const response = await fetch(FUNCTION_URL,{
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "apikey":SUPABASE_KEY,
      "Authorization":"Bearer " + SUPABASE_KEY
    },
    body:JSON.stringify({code})
  });

  const data = await response.json();

  if(!data.ok){
    throw new Error(JSON.stringify(data));
  }

  return data;
}

function titulo(pos){
  if(pos === 1) return "🥇 Gran Jabalí";
  if(pos === 2) return "🥈 Colmillo de Plata";
  if(pos === 3) return "🥉 Pezuña de Hierro";
  return "#" + pos;
}

function color(pos){
  if(pos === 1) return "gold";
  if(pos === 2) return "silver";
  if(pos === 3) return "bronze";
  return "";
}

async function loadDashboard(){
  const status = document.getElementById("status");

  try{
    status.innerText = "Leyendo ranking...";
    const ranking = await readTable("leaderboard");

    if(ranking.length > 0){
      const leader = ranking[0];
      const leaderName = leader.profile_name || "Jabalí";

      document.getElementById("kingAvatar").innerText = leaderName.charAt(0).toUpperCase();
      document.getElementById("kingName").innerText = leaderName;
      document.getElementById("kingPoints").innerText = Math.round(leader.total_points || 0) + " pts";
      document.getElementById("kingStats").innerText =
        (leader.activities || 0) + " salidas · " +
        Math.round(leader.total_km || 0) + " km · " +
        Math.round(leader.total_elevation || 0) + " m+";

      document.getElementById("points").innerText = Math.round(leader.total_points || 0);
      document.getElementById("activities").innerText = leader.activities || 0;
      document.getElementById("km").innerText = Math.round(leader.total_km || 0);
      document.getElementById("elevation").innerText = Math.round(leader.total_elevation || 0);

      let list = "";
      let podium = "";

      ranking.forEach((r)=>{
        list +=
          "<div class='row'>" +
          "<div><strong class='" + color(r.position) + "'>" + titulo(r.position) + "</strong><br>" +
          "<span class='small'>" + (r.profile_name || "Jabalí") + "</span></div>" +
          "<div class='green'><strong>" + Math.round(r.total_points || 0) + " pts</strong></div>" +
          "</div>";

        if(r.position <= 3){
          podium +=
            "<div class='row'>" +
            "<div><strong class='" + color(r.position) + "'>" + titulo(r.position) + "</strong><br>" +
            "<span class='small'>" + (r.profile_name || "Jabalí") + "</span></div>" +
            "<div>" + Math.round(r.total_points || 0) + " pts</div>" +
            "</div>";
        }
      });

      document.getElementById("rankingList").innerHTML = list;
      document.getElementById("podium").innerHTML = podium;
    }

    status.innerText = "Leyendo actividades...";
    const recent = await readTable("recent_activities");

    let activities = "";

    recent.forEach((a)=>{
      activities +=
        "<div class='row'>" +
        "<div><strong>" + (a.name || "Actividad") + "</strong><br>" +
        "<span class='small'>" + (a.distance_km || 0) + " km · " + (a.elevation_m || 0) + " m+</span></div>" +
        "<div class='green'>🏆 " + (a.points || 0) + "</div>" +
        "</div>";
    });

    document.getElementById("recent").innerHTML = activities;
    status.innerText = "🟢 Dashboard cargado";
  }

  catch(error){
    status.innerText = "❌ " + error.message;
  }
}

async function start(){
  const params = new URLSearchParams(window.location.search);
  const code = params.get("code");

  if(code){
    try{
      document.getElementById("status").innerText = "Importando participante desde Strava...";
      const result = await importFromStrava(code);
      document.getElementById("status").innerText =
        "✅ Participante añadido: " + result.athlete + " · " + result.imported + " actividades";

      window.history.replaceState({}, document.title, REDIRECT_URL);
    }catch(error){
      document.getElementById("status").innerText = "❌ " + error.message;
    }
  }

  await loadDashboard();
}

start();
</script>

</body>
</html>
