<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jabalises Bikers</title>

<style>
body{margin:0;background:#07111f;color:white;font-family:Arial}
.app{display:grid;grid-template-columns:280px 1fr;min-height:100vh}
.sidebar{background:#091421;padding:24px;border-right:1px solid #1f2937}
.main{padding:30px}
.logo{font-size:32px;font-weight:bold;margin-bottom:40px}
.logo span{color:#f97316}
.nav div{padding:14px;margin:8px 0;border-radius:12px}
.active{background:#26170d;color:#f97316}
.profile,.card,.panel{background:#111827;border-radius:20px;padding:22px}
.avatar{width:90px;height:90px;border-radius:50%;background:#f97316;color:#111827;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:bold;margin:auto}
.badge{border:1px solid #f97316;color:#f97316;border-radius:999px;padding:8px 12px;display:inline-block}
.level{color:#22c55e;font-size:30px;font-weight:bold}
.top{display:flex;justify-content:space-between;align-items:center}
button{background:#f97316;color:white;border:0;border-radius:12px;padding:14px 18px;font-weight:bold}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:24px}
.value{font-size:34px;font-weight:bold}
.grid{display:grid;grid-template-columns:2fr 1fr;gap:18px;margin-top:20px}
.activity{display:flex;justify-content:space-between;border-bottom:1px solid #1f2937;padding:14px 0}
.small{color:#94a3b8;white-space:pre-wrap}
.green{color:#22c55e}
.orange{color:#f97316}
.gold{color:#facc15}
@media(max-width:900px){.app{grid-template-columns:1fr}.sidebar{display:none}.cards{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}}
</style>
</head>

<body>

<div class="app">

<aside class="sidebar">
<div class="logo">🐗 JABALISES<br><span>BIKERS</span></div>

<div class="nav">
<div class="active">🏆 Ranking</div>
<div>🚴 Actividades</div>
<div>📊 Estadísticas</div>
<div>🎯 Desafíos</div>
</div>

<div class="profile">
<div id="avatar" class="avatar">J</div>
<h2 id="displayName">Jabalí</h2>
<div id="badge" class="badge">Gran Jabalí</div>
<div id="level" class="level">Nivel 1</div>
<h3 id="profilePoints">0 pts</h3>
</div>
</aside>

<main class="main">

<div class="top">
<div>
<h1>Dashboard</h1>
<p id="status" class="small">Preparado</p>
</div>
<button onclick="loadDashboard()">🔄 Actualizar</button>
</div>

<div class="cards">
<div class="card">🏆<div id="points" class="value gold">0</div><p class="small">puntos</p></div>
<div class="card">🚴<div id="activities" class="value">0</div><p class="small">salidas</p></div>
<div class="card">📍<div id="km" class="value">0</div><p class="small">km</p></div>
<div class="card">⛰️<div id="elevation" class="value orange">0</div><p class="small">desnivel</p></div>
</div>

<div class="grid">

<div>
<div class="panel">
<h2>🚴 Actividades recientes</h2>
<div id="recent"></div>
</div>
</div>

<div>
<div class="panel">
<h2>🐗 Podio</h2>
<p class="gold">🥇 Gran Jabalí</p>
<p>🥈 Colmillo de Plata</p>
<p class="orange">🥉 Pezuña de Hierro</p>
</div>
</div>

</div>

</main>
</div>

<script>
const SUPABASE_URL = "https://bktwylokqyjuoernembh.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJrdHd5bG9rcXlqdW9lcm5lbWJoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2NjAyMTAsImV4cCI6MjA5NTIzNjIxMH0.1AEpUCfoGn7-KYIU8tcQhmfLvd5Go6KyIBXTdp-9_vM

";

async function getTable(name){
  const response = await fetch(
    SUPABASE_URL + "/rest/v1/" + name + "?select=*",
    {
      headers:{
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY
      }
    }
  );

  const text = await response.text();

  if(!response.ok){
    throw new Error(name + ": " + text);
  }

  return JSON.parse(text);
}

async function loadDashboard(){
  const status = document.getElementById("status");

  try{
    status.innerText = "1/3 Cargando perfil...";

    const profile = await getTable("profile_dashboard");

    if(profile.length > 0){
      const p = profile[0];
      const name = p.display_name || "Jabalí";

      document.getElementById("avatar").innerText = name.charAt(0).toUpperCase();
      document.getElementById("displayName").innerText = "🐗 " + name;
      document.getElementById("badge").innerText = "🏆 " + (p.badge || "Sin insignia");
      document.getElementById("level").innerText = "🔥 Nivel " + (p.level || 1);
      document.getElementById("profilePoints").innerText = "⭐ " + (p.total_points || 0) + " pts";
    }

    status.innerText = "2/3 Cargando ranking...";

    const ranking = await getTable("weekly_ranking");

    if(ranking.length > 0){
      const r = ranking[0];

      document.getElementById("points").innerText = Math.round(r.total_points || 0);
      document.getElementById("activities").innerText = r.activities || 0;
      document.getElementById("km").innerText = r.total_km || 0;
      document.getElementById("elevation").innerText = r.total_elevation || 0;
    }

    status.innerText = "3/3 Cargando actividades...";

    const recent = await getTable("recent_activities");

    let html = "";

    recent.forEach((a)=>{
      html += `
      <div class="activity">
        <div>
          <strong>${a.name || "Actividad"}</strong><br>
          <span class="small">${a.distance_km || 0} km · ${a.elevation_m || 0} m+</span>
        </div>
        <div class="green">🏆 ${a.points || 0}</div>
      </div>
      `;
    });

    document.getElementById("recent").innerHTML = html;

    status.innerText = "🟢 Dashboard cargado correctamente";
  }

  catch(error){
    status.innerText = "❌ ERROR:\n" + error.message;
  }
}

loadDashboard();
</script>

</body>
</html>
