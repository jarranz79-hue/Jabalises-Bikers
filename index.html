<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Jabalises Bikers</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
margin:0;
padding:24px;
background:#07111f;
color:white;
font-family:Arial;
}

.card{
background:#111827;
padding:24px;
border-radius:20px;
margin-top:20px;
}

.ok{
color:#22c55e;
}

.error{
color:#ef4444;
}

button{
background:#f97316;
border:0;
padding:14px 20px;
border-radius:12px;
color:white;
font-size:16px;
}

pre{
white-space:pre-wrap;
}

</style>

</head>

<body>

<h1>

🐗 Jabalises Bikers

</h1>

<button onclick="test()">

🔄 Probar conexión

</button>

<div class="card">

<h2>

Estado

</h2>

<div id="status">

Esperando...

</div>

</div>

<div class="card">

<h2>

Perfil

</h2>

<pre id="profile">

—

</pre>

</div>

<script>

const SUPABASE_URL =
"https://bktwylokqyjuoernembh.supabase.co";

const SUPABASE_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJrdHd5bG9rcXlqdW9lcm5lbWJoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2NjAyMTAsImV4cCI6MjA5NTIzNjIxMH0.1AEpUCfoGn7-KYIU8tcQhmfLvd5Go6KyIBXTdp-9_vM";

const status =
document.getElementById(
"status"
);

const profile =
document.getElementById(
"profile"
);

async function test(){

try{

status.innerHTML =
"Conectando...";

const supabase =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

status.innerHTML =
"Conectado → leyendo profile_dashboard";

const result =
await supabase

.from(
"profile_dashboard"
)

.select(
"*"
)

.limit(
1
);

if(
result.error
){

throw result.error;

}

status.innerHTML =
'<span class="ok">✅ Supabase responde</span>';

profile.innerText =
JSON.stringify(
result.data,
null,
2
);

}

catch(e){

status.innerHTML =
'<span class="error">❌ ERROR</span>';

profile.innerText =
JSON.stringify(
e,
null,
2
);

}

}

test();

</script>

</body>

</html>
