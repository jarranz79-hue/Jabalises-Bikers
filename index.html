<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jabalises Bikers</title>

<style>
body{
  background:#111827;
  color:white;
  font-family:Arial;
  text-align:center;
  padding:30px;
}
.card{
  background:#1f2937;
  padding:25px;
  border-radius:18px;
  max-width:700px;
  margin:auto;
}
button{
  padding:14px;
  border:0;
  border-radius:10px;
  background:#fc4c02;
  color:white;
  font-weight:bold;
  cursor:pointer;
}
.activity{
  background:#374151;
  margin:12px 0;
  padding:15px;
  border-radius:12px;
  text-align:left;
}
.small{color:#9ca3af}
</style>
</head>

<body>

<div class="card">
<h1>🏔️ Jabalises Bikers</h1>
<p>Actividades reales de Strava</p>

<button onclick="connectStrava()">🚴 Conectar Strava</button>

<p id="msg" class="small">Preparado</p>

<div id="activities"></div>
</div>

<script>
const STRAVA_CLIENT_ID = "250583";
const REDIRECT = "https://jarranz79-hue.github.io/Jabalises-Bikers/";

const SUPABASE_KEY = "sb_publishable_bEvn9tUCIgXCwoLb9nNWyg_SXOXuT-k";
const FUNCTION_URL = "https://bktwylokqyjuoernembh.supabase.co/functions/v1/strava-auth";

const params = new URLSearchParams(window.location.search);
const code = params.get("code");

if(code){
  document.getElementById("msg").innerText =
  "🎟️ Código recibido. Buscando actividades...";
  loadActivities(code);
}

function connectStrava(){
  const url =
  "https://www.strava.com/oauth/authorize" +
  "?client_id=" + STRAVA_CLIENT_ID +
  "&response_type=code" +
  "&redirect_uri=" + encodeURIComponent(REDIRECT) +
  "&approval_prompt=force" +
  "&scope=read,activity:read_all";

  window.location.href = url;
}

async function loadActivities(code){
  try{
    const response = await fetch(FUNCTION_URL,{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "apikey":SUPABASE_KEY,
        "Authorization":"Bearer " + SUPABASE_KEY
      },
      body:JSON.stringify({code:code})
    });

    const data = await response.json();

    if(!data.ok){
      document.getElementById("msg").innerText =
      "❌ Error leyendo Strava";
      console.log(data);
      return;
    }

    document.getElementById("msg").innerText =
    "✅ Actividades cargadas";

    const container = document.getElementById("activities");
    container.innerHTML = "";

    data.actividades.forEach((act)=>{
      const div = document.createElement("div");
      div.className = "activity";

      div.innerHTML =
      "<strong>" + act.nombre + "</strong><br>" +
      "Tipo: " + act.tipo + "<br>" +
      "Fecha: " + new Date(act.fecha).toLocaleDateString("es-ES") + "<br>" +
      "Km: " + act.km + "<br>" +
      "Desnivel: " + act.desnivel + " m<br>" +
      "Tiempo: " + act.minutos + " min";

      container.appendChild(div);
    });

  }catch(error){
    document.getElementById("msg").innerText =
    "❌ Error conectando";
  }
}
</script>

</body>
</html>
