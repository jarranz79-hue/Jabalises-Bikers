<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jabalises Bikers</title>

<style>
*{box-sizing:border-box}
body{margin:0;padding:22px;font-family:Arial;background:radial-gradient(circle at top,#17233d,#07111f 60%);color:white}
.header{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap}
h1{margin:0;color:#f97316}
.actions{display:flex;gap:10px;flex-wrap:wrap}
button,select{background:#f97316;color:white;border:0;padding:14px 18px;border-radius:14px;font-weight:bold;cursor:pointer}
select{background:#111827;border:1px solid #f97316}
.strava{background:#fc4c02}
.admin{background:#16a34a}
.status,.small{color:#94a3b8}
.card{background:#111827;border:1px solid #1f2937;border-radius:24px;padding:22px;margin-bottom:18px}
.row{display:flex;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid #1f2937}
.green{color:#22c55e}.gold{color:#facc15}.silver{color:#cbd5e1}.bronze{color:#fb923c}
.podium{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:14px;align-items:end}
.podium-card{background:#0b1224;border:1px solid #1f2937;border-radius:24px;padding:20px;text-align:center}
.first{border:2px solid #facc15;transform:scale(1.04)}
.avatar{width:72px;height:72px;border-radius:50%;margin:auto auto 12px auto;background:linear-gradient(135deg,#f97316,#facc15);display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:bold;color:#111827;object-fit:cover}
.first .avatar{width:92px;height:92px;font-size:42px}
.points{font-size:38px;font-weight:bold}
#movements{font-size:16px;line-height:1.5}
.hidden{display:none}
.more-btn{margin-top:12px;width:100%;background:#1f2937;color:white;border:1px solid #374151}
@media(max-width:900px){.podium{grid-template-columns:1fr}}
.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.7);
display:flex;
align-items:center;
justify-content:center;
z-index:999;
padding:20px;
}

.modal-content{
background:#111827;
border:1px solid #374151;
border-radius:24px;
padding:24px;
max-width:520px;
width:100%;
}

.clickable{
cursor:pointer;
}
</style>
</head>

<body>

<div class="header">
  <div>
    <h1>🐗 Jabalises Bikers</h1>
    <div id="status" class="status">Dashboard cargando...</div>
  </div>

  <div class="actions">
    <select id="seasonSelect" onchange="changeSeason()"></select>
    <button class="strava" onclick="connectStrava()">🚴 Conectar Strava</button>
    <button onclick="loadDashboard()">🔄 Actualizar</button>
    <button id="adminSyncBtn" class="admin" onclick="syncStrava()" style="display:none">👑 Actualizar Strava</button>
  </div>
</div>

<div class="card">
  <h2>🔔 Últimos movimientos</h2>
  <div id="movements">Sin movimientos todavía</div>
</div>

<div class="card">
  <h2>🐗 Podio Jabalí</h2>
  <div id="podium" class="podium">Cargando podio...</div>
</div>

<div class="card">
  <h2>🏆 Clasificación anual</h2>
  <div id="ranking">Cargando ranking...</div>
</div>

<div class="card">
  <h2>🚴 Actividades recientes</h2>
  <div id="activities">Cargando actividades...</div>
</div>

<script>
const SUPABASE_URL =
"https://bktwylokqyjuoernembh.supabase.co";

const SUPABASE_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJrdHd5bG9rcXlqdW9lcm5lbWJoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2NjAyMTAsImV4cCI6MjA5NTIzNjIxMH0.1AEpUCfoGn7-KYIU8tcQhmfLvd5Go6KyIBXTdp-9_vM";

const FUNCTION_URL =
"https://bktwylokqyjuoernembh.supabase.co/functions/v1/strava-auth";

const STRAVA_CLIENT_ID =
"250583";
const REDIRECT_URL = "https://jarranz79-hue.github.io/Jabalises-Bikers/";
let selectedSeason = new Date().getFullYear();

async function read(path){
  const response = await fetch(SUPABASE_URL + path,{
    headers:{
      apikey: SUPABASE_KEY,
      Authorization: "Bearer " + SUPABASE_KEY
    }
  });

  if(!response.ok){
    throw new Error(await response.text());
  }

  return await response.json();
}

function connectStrava(){
  const url =
    "https://www.strava.com/oauth/authorize" +
    "?client_id=" + STRAVA_CLIENT_ID +
    "&response_type=code" +
    "&redirect_uri=" + encodeURIComponent(REDIRECT_URL) +
    "&approval_prompt=force" +
    "&scope=read,activity:read_all";

  window.location.href = url;
}

async function importFromStrava(code){
  const response = await fetch(FUNCTION_URL,{
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      apikey: SUPABASE_KEY,
      Authorization: "Bearer " + SUPABASE_KEY
    },
    body: JSON.stringify({code})
  });

  return await response.json();
}

async function checkAdmin(){
  try{
    const rows = await read("/rest/v1/admin_status?select=is_admin");

    document.getElementById("adminSyncBtn").style.display =
      rows.length > 0 && rows[0].is_admin === true
      ? "inline-block"
      : "none";
  }catch(e){
    document.getElementById("adminSyncBtn").style.display = "none";
  }
}

async function syncStrava(){
  const btn = document.getElementById("adminSyncBtn");

  btn.disabled = true;
  btn.innerText = "⏳ Sincronizando";
  document.getElementById("status").innerText = "Sincronizando Strava...";

  try{
    const response = await fetch(
      SUPABASE_URL + "/functions/v1/admin-sync-strava",
      {
        method:"POST",
        headers:{
          apikey: SUPABASE_KEY,
          Authorization: "Bearer " + SUPABASE_KEY
        }
      }
    );

    const data = await response.json();

    if(!data.ok){
      throw new Error(JSON.stringify(data));
    }

    document.getElementById("status").innerText =
      "✅ Strava actualizado · " +
      data.synced +
      " participantes · " +
      data.imported +
      " actividades";

    await loadSeasons();
    await loadDashboard();
  }catch(error){
    document.getElementById("status").innerText =
      "❌ " + error.message;
  }

  btn.disabled = false;
  btn.innerText = "👑 Actualizar Strava";
}

function titleFor(pos){
  if(pos===1) return "🥇 Gran Jabalí";
  if(pos===2) return "🥈 Colmillo Plata";
  if(pos===3) return "🥉 Pezuña Hierro";
  return "#" + pos;
}

function colorFor(pos){
  if(pos===1) return "gold";
  if(pos===2) return "silver";
  if(pos===3) return "bronze";
  return "";
}

function avatar(name){
  return (name || "J").charAt(0).toUpperCase();
}

function podiumCard(r, leaderPoints){
  const first = r.position===1 ? "first" : "";
  const points = Number(r.total_points || 0);

  const gap =
    r.position === 1
    ? "👑 Líder"
    : "-" + Math.max(0, leaderPoints - points) + " pts del líder";

  const avatarHtml =
    r.avatar_url
    ? `<img src="${r.avatar_url}" class="avatar">`
    : `<div class="avatar">${avatar(r.display_name)}</div>`;

  return `
    <div class="podium-card ${first}">
      <div class="${colorFor(r.position)}"><strong>${titleFor(r.position)}</strong></div>
      ${avatarHtml}
      <h2>${r.display_name}</h2>
      <div class="points ${colorFor(r.position)}">${points}</div>
      <div class="small">${gap}</div>
      <div class="small">${r.activities} salidas</div>
      <div class="small">${r.total_km} km · ${r.total_elevation} m+</div>
    </div>
  `;
}

async function loadSeasons(){
  const rows = await read("/rest/v1/yearly_ranking?select=season");

  const seasons = [...new Set(rows.map(r=>r.season))]
    .filter(Boolean)
    .sort((a,b)=>b-a);

  const select = document.getElementById("seasonSelect");
  select.innerHTML = "";

  seasons.forEach((s)=>{
    const option = document.createElement("option");
    option.value = s;
    option.textContent = "Temporada " + s;

    if(Number(s) === Number(selectedSeason)){
      option.selected = true;
    }

    select.appendChild(option);
  });

  if(seasons.length && !seasons.includes(selectedSeason)){
    selectedSeason = seasons[0];
  }
}

function changeSeason(){
  selectedSeason = Number(document.getElementById("seasonSelect").value);
  loadDashboard();
}

function toggleMovements(){
  const extra = document.getElementById("movementsExtra");
  const btn = document.getElementById("movementsBtn");

  if(!extra || !btn) return;

  const hidden = extra.classList.contains("hidden");

  if(hidden){
    extra.classList.remove("hidden");
    btn.innerText = "Ocultar movimientos";
  }else{
    extra.classList.add("hidden");
    btn.innerText = "Ver 10 movimientos más";
  }
}

function toggleActivities(){
  const extra = document.getElementById("activitiesExtra");
  const btn = document.getElementById("activitiesBtn");

  if(!extra || !btn) return;

  const hidden = extra.classList.contains("hidden");

  if(hidden){
    extra.classList.remove("hidden");
    btn.innerText = "Ocultar actividades";
  }else{
    extra.classList.add("hidden");
    btn.innerText = "Ver 10 actividades más";
  }
}
async function openProfileModal(profileId){
  const rows = await read(
    "/rest/v1/competitor_profiles?profile_id=eq." +
    profileId +
    "&season=eq." +
    selectedSeason
  );

  if(!rows.length){
    return;
  }

  const p = rows[0];

  document.getElementById("profileTitle").innerText =
    "👤 " + p.display_name;

  document.getElementById("profileBody").innerHTML =
    "<div class='row'><div>🏆 Puntos</div><div class='green'>" + p.total_points + "</div></div>" +
    "<div class='row'><div>🚴 Actividades</div><div>" + p.total_activities + "</div></div>" +
    "<div class='row'><div>📍 Km totales</div><div>" + p.total_km + " km</div></div>" +
    "<div class='row'><div>⛰️ Desnivel total</div><div>" + p.total_elevation + " m+</div></div>" +

    "<h3>🚵 MTB / Gravel</h3>" +
    "<div class='row'><div>Salidas</div><div>" + p.mtb_activities + "</div></div>" +
    "<div class='row'><div>Km</div><div>" + p.mtb_km + " km</div></div>" +
    "<div class='row'><div>Desnivel</div><div>" + p.mtb_elevation + " m+</div></div>" +
    "<div class='row'><div>Puntos</div><div class='green'>" + p.mtb_points + "</div></div>" +

    "<h3>⚡ eBike</h3>" +
    "<div class='row'><div>Salidas</div><div>" + p.ebike_activities + "</div></div>" +
    "<div class='row'><div>Km</div><div>" + p.ebike_km + " km</div></div>" +
    "<div class='row'><div>Desnivel</div><div>" + p.ebike_elevation + " m+</div></div>" +
    "<div class='row'><div>Puntos</div><div class='green'>" + p.ebike_points + "</div></div>" +

    "<h3>🚴 Carretera</h3>" +
    "<div class='row'><div>Salidas</div><div>" + p.road_activities + "</div></div>" +
    "<div class='row'><div>Km</div><div>" + p.road_km + " km</div></div>" +
    "<div class='row'><div>Desnivel</div><div>" + p.road_elevation + " m+</div></div>" +
    "<div class='row'><div>Puntos</div><div class='green'>" + p.road_points + "</div></div>";

  document.getElementById("profileModal").classList.remove("hidden");
}

function closeProfileModal(){
  document.getElementById("profileModal").classList.add("hidden");
}

async function loadDashboard(){
  try{
    document.getElementById("status").innerText = "Leyendo ranking...";

    const ranking = await read(
      "/rest/v1/yearly_ranking?season=eq." +
      selectedSeason +
      "&order=position.asc"
    );

    const second = ranking.find(r=>r.position===2);
    const first = ranking.find(r=>r.position===1);
    const third = ranking.find(r=>r.position===3);

    const leaderPoints =
      first
      ? Number(first.total_points || 0)
      : 0;

    let podiumHtml = "";
    if(second) podiumHtml += podiumCard(second, leaderPoints);
    if(first) podiumHtml += podiumCard(first, leaderPoints);
    if(third) podiumHtml += podiumCard(third, leaderPoints);

    document.getElementById("podium").innerHTML =
      podiumHtml || "Sin podio";

    const rest = ranking.filter(r=>r.position>=4);

    let rankingHtml = "";

    rest.forEach((r)=>{
      const diff = leaderPoints - Number(r.total_points || 0);

      rankingHtml +=
        "<div class='row'>" +
        "<div><strong>#" + r.position + "</strong><br>" +
        "<span class='small'>" + r.display_name + "</span></div>" +
        "<div><span class='green'>" + r.total_points + " pts</span><br>" +
        "<span class='small'>-" + diff + " pts</span></div>" +
        "</div>";
    });

    document.getElementById("ranking").innerHTML =
      rankingHtml || "No hay más participantes";

    document.getElementById("status").innerText = "Leyendo actividades...";

    let activities = [];

    try{
      activities = await read(
        "/rest/v1/recent_dashboard_activities?select=*&limit=13"
      );
    }catch(e){
      console.log("No se pudieron cargar actividades", e);
      activities = [];
    }

    let activitiesPreviewHtml = "";
    let activitiesExtraHtml = "";

    activities.forEach((a,index)=>{
      const item =
        "<div class='row'>" +
        "<div><strong>" + (a.name || "Actividad") + "</strong><br>" +
        "<span class='small'>" + (a.distance_km || 0) + " km · " + (a.elevation_m || 0) + " m+</span></div>" +
        "<div class='green'>🏆 " + (a.points || 0) + "</div>" +
        "</div>";

      if(index < 3){
        activitiesPreviewHtml += item;
      }else if(index < 13){
        activitiesExtraHtml += item;
      }
    });

    document.getElementById("activities").innerHTML =
      activitiesPreviewHtml
      ? activitiesPreviewHtml +
        (activitiesExtraHtml
          ? "<div id='activitiesExtra' class='hidden'>" +
              activitiesExtraHtml +
            "</div>" +
            "<button id='activitiesBtn' class='more-btn' onclick='toggleActivities()'>" +
            "Ver 10 actividades más" +
            "</button>"
          : "")
      : "Sin actividades";

    document.getElementById("status").innerText = "Leyendo movimientos...";

    let notifications = [];

    try{
      notifications = await read(
        "/rest/v1/recent_notifications?select=*&limit=13"
      );
    }catch(e){
      console.log("No se pudieron cargar movimientos", e);
      notifications = [];
    }

    let previewHtml = "";
    let extraHtml = "";

    notifications.forEach((n,index)=>{
      const date = new Date(n.created_at);

      const item =
        "<div style='padding:14px 0;border-bottom:1px solid #1f2937'>" +
        "<div style='font-size:18px'>" +
        (n.message || "Movimiento detectado") +
        "</div>" +
        "<div class='small' style='margin-top:6px'>" +
        (n.profile_name || "Jabalí") +
        " · " +
        date.toLocaleDateString("es-ES") +
        "</div>" +
        "</div>";

      if(index < 3){
        previewHtml += item;
      }else if(index < 13){
        extraHtml += item;
      }
    });

    document.getElementById("movements").innerHTML =
      previewHtml
      ? previewHtml +
        (extraHtml
          ? "<div id='movementsExtra' class='hidden'>" +
              extraHtml +
            "</div>" +
            "<button id='movementsBtn' class='more-btn' onclick='toggleMovements()'>" +
            "Ver 10 movimientos más" +
            "</button>"
          : "")
      : "Sin movimientos todavía";

    document.getElementById("status").innerText = "🟢 Dashboard cargado";
  }catch(error){
    document.getElementById("status").innerText =
      "❌ " + error.message;
  }
}

async function start(){
  await checkAdmin();

  const params = new URLSearchParams(window.location.search);
  const code = params.get("code");

  if(code){
    document.getElementById("status").innerText = "Importando Strava...";

    try{
      const result = await importFromStrava(code);

      if(!result.ok){
        throw new Error(JSON.stringify(result));
      }

      window.history.replaceState({}, document.title, REDIRECT_URL);
    }catch(error){
      document.getElementById("status").innerText =
        "❌ " + error.message;
      return;
    }
  }

  await loadSeasons();
  await loadDashboard();
}

start();
</script>

</body>
</html>
