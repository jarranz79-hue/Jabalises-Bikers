<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jabalises Bikers</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;padding:24px;background:#07111f;color:white;font-family:Arial}
h1{color:#f97316}
.card{background:#111827;padding:22px;border-radius:20px;margin-top:18px}
.value{font-size:40px;color:#22c55e;font-weight:bold}
.small{color:#94a3b8}
button{background:#f97316;color:white;border:0;border-radius:12px;padding:14px 20px}
</style>
</head>
<body>

<h1>🐗 Jabalises Bikers</h1>
<p id="status" class="small">Preparado</p>
<button onclick="loadApp()">🔄 Actualizar</button>

<div class="card">
<h2>🏆 Ranking semanal</h2>
<p>Puntos</p>
<div id="points" class="value">0</div>
<p>Salidas</p>
<div id="activities" class="value">0</div>
<p>Kilómetros</p>
<div id="km" class="value">0</div>
<p>Desnivel</p>
<div id="elevation" class="value">0</div>
</div>

<script>
const SUPABASE_URL = "https://bktwylokqyjuoernembh.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJrdHd5bG9rcXlqdW9lcm5lbWJoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2NjAyMTAsImV4cCI6MjA5NTIzNjIxMH0.1AEpUCfoGn7-KYIU8tcQhmfLvd5Go6KyIBXTdp-9_vM";

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function loadApp(){
  const status = document.getElementById("status");

  try{
    status.innerText = "Cargando ranking...";

    const result = await supabase
      .from("rankings")
      .select("*")
      .limit(1);

    if(result.error){
      status.innerText = "❌ " + result.error.message;
      return;
    }

    if(!result.data || result.data.length === 0){
      status.innerText = "No hay datos";
      return;
    }

    const r = result.data[0];

    document.getElementById("points").innerText = Math.round(r.total_points || 0);
    document.getElementById("activities").innerText =
r.total_activities || 0;

document.getElementById("km").innerText =
Math.round(r.total_km || 0);

document.getElementById("elevation").innerText =
Math.round(r.total_elevation_m || 0);

    status.innerText = "🟢 Ranking cargado";
  }catch(e){
    status.innerText = "❌ " + e.message;
  }
}

loadApp();
</script>

</body>
</html>
