<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jabalises Bikers</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;background:#07111f;color:white;font-family:Arial;padding:30px}
.card{background:#111827;padding:30px;border-radius:20px;max-width:700px;margin:auto}
.avatar{width:90px;height:90px;border-radius:50%;background:#f97316;color:#111827;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:bold}
.green{color:#22c55e}
.small{color:#94a3b8;white-space:pre-wrap}
button{background:#f97316;color:white;border:0;border-radius:10px;padding:12px 18px;font-weight:bold}
</style>
</head>

<body>

<div class="card">
<h1>🐗 Jabalises Bikers</h1>

<div id="avatar" class="avatar">J</div>

<h2 id="displayName">Cargando...</h2>
<p id="badge">Cargando insignia...</p>
<p id="level" class="green">Cargando nivel...</p>
<p id="points">Cargando puntos...</p>

<button onclick="loadProfile()">🔄 Actualizar</button>

<p id="debug" class="small">Iniciando...</p>
</div>

<script>
const SUPABASE_URL = "https://bktwylokqyjuoernembh.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJrdHd5bG9rcXlqdW9lcm5lbWJoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2NjAyMTAsImV4cCI6MjA5NTIzNjIxMH0.1AEpUCfoGn7-KYIU8tcQhmfLvd5Go6KyIBXTdp-9_vM";

let supabaseClient;

try{
  document.getElementById("debug").innerText = "Creando conexión Supabase...";

  supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  document.getElementById("debug").innerText = "Conexión creada ✅";
}
catch(e){
  document.getElementById("debug").innerText =
  "❌ Error creando Supabase:\n" + e.message;
}

async function loadProfile(){
  document.getElementById("debug").innerText = "Buscando perfil...";

  try{
    const result = await supabaseClient
      .from("profile_dashboard")
      .select("*");

    if(result.error){
      document.getElementById("debug").innerText =
      "❌ Error Supabase:\n" + JSON.stringify(result.error);
      return;
    }

    document.getElementById("debug").innerText =
    "Respuesta recibida:\n" + JSON.stringify(result.data);

    if(!result.data || result.data.length === 0){
      document.getElementById("displayName").innerText = "Perfil vacío";
      return;
    }

    const p = result.data[0];

    const name = p.display_name || "Jabalí";
    const badge = p.badge || "Sin insignia";
    const level = p.level || 1;
    const points = p.total_points || 0;

    document.getElementById("avatar").innerText =
    name.charAt(0).toUpperCase();

    document.getElementById("displayName").innerText =
    "🐗 " + name;

    document.getElementById("badge").innerText =
    "🏆 " + badge;

    document.getElementById("level").innerText =
    "🔥 Nivel " + level;

    document.getElementById("points").innerText =
    "⭐ " + points + " pts";
  }
  catch(e){
    document.getElementById("debug").innerText =
    "❌ Error JavaScript:\n" + e.message;
  }
}

loadProfile();
</script>

</body>
</html>
