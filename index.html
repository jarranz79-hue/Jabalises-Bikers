<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jabalises Bikers</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{margin:0;background:#07111f;color:#f8fafc;font-family:Arial}

.app{
display:grid;
grid-template-columns:260px 1fr;
min-height:100vh;
}

.sidebar{
background:#091421;
padding:24px;
border-right:1px solid #1f2937;
}

.logo{
font-size:28px;
font-weight:bold;
margin-bottom:40px;
}

.logo span{
color:#f97316;
}

.nav div{
padding:16px;
margin:10px 0;
border-radius:12px;
}

.active{
background:#26170d;
color:#f97316;
}

.profile{
background:#111827;
border-radius:22px;
padding:22px;
margin-top:40px;
text-align:center;
}

.avatar{
width:90px;
height:90px;
border-radius:50%;
margin:auto;
display:flex;
align-items:center;
justify-content:center;
font-size:38px;
font-weight:bold;
background:
linear-gradient(
135deg,
#f97316,
#facc15
);
color:#111827;
}

.badge{
margin-top:12px;
padding:8px 12px;
border-radius:999px;
display:inline-block;
border:1px solid #f97316;
color:#f97316;
}

.level{
font-size:30px;
font-weight:bold;
color:#22c55e;
margin-top:10px;
}

.points{
font-size:22px;
font-weight:bold;
margin-top:10px;
}

.main{
padding:30px;
}

.top{
display:flex;
justify-content:space-between;
align-items:center;
}

button{
background:#f97316;
color:white;
border:0;
padding:14px 18px;
border-radius:12px;
cursor:pointer;
font-weight:bold;
}

.hero{
background:#111827;
padding:30px;
border-radius:22px;
}

.hero h1{
margin:0;
font-size:48px;
}

.small{
color:#94a3b8;
}

@media(max-width:900px){

.app{
grid-template-columns:1fr;
}

.sidebar{
display:none;
}

}
</style>
</head>

<body>

<div class="app">

<aside class="sidebar">

<div class="logo">

🐗 JABALISES

<br>

<span>

BIKERS

</span>

</div>

<div class="nav">

<div class="active">

🏆 Ranking

</div>

<div>

🚴 Actividades

</div>

<div>

📊 Estadísticas

</div>

<div>

🎯 Desafíos

</div>

</div>

<div class="profile">

<div
id="avatar"
class="avatar">

J

</div>

<h2
id="displayName">

Jabalí

</h2>

<div
id="badge"
class="badge">

Gran Jabalí

</div>

<div
id="level"
class="level">

Nivel 1

</div>

<div
id="totalPoints"
class="points">

0 pts

</div>

</div>

</aside>

<main class="main">

<div class="top">

<div>

<h1>

Dashboard

</h1>

<p class="small">

Perfil Jabalí

</p>

</div>

<button
onclick="loadProfile()">

🔄 Actualizar

</button>

</div>

<div
class="hero">

<h1>

🐗 Bienvenido

</h1>

<p
id="welcome"
class="small">

Cargando perfil...

</p>

</div>

</main>

</div>

<script>

const SUPABASE_URL =
"https://bktwylokqyjuoernembh.supabase.co";

const SUPABASE_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJrdHd5bG9rcXlqdW9lcm5lbWJoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2NjAyMTAsImV4cCI6MjA5NTIzNjIxMH0.1AEpUCfoGn7-KYIU8tcQhmfLvd5Go6KyIBXTdp-9_vM";

const supabase =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

function initial(name){

return (
name ||
"J"
)

.charAt(
0
)

.toUpperCase();

}

async function loadProfile(){

document
.getElementById(
"welcome"
)

.innerText =

"Cargando perfil...";

const {

data,

error

}

=

await supabase

.from(
"profile_dashboard"
)

.select(
"*"
)

.limit(
1
);

if(
error
){

document
.getElementById(
"welcome"
)

.innerText =

error.message;

return;

}

if(
!data.length
){

document
.getElementById(
"welcome"
)

.innerText =

"Perfil vacío";

return;

}

const p =
data[0];

document
.getElementById(
"avatar"
)

.innerText =

initial(
p.display_name
);

document
.getElementById(
"displayName"
)

.innerText =

"🐗 " +

p.display_name;

document
.getElementById(
"badge"
)

.innerText =

"🏆 " +

p.badge;

document
.getElementById(
"level"
)

.innerText =

"🔥 Nivel " +

p.level;

document
.getElementById(
"totalPoints"
)

.innerText =

"⭐ " +

p.total_points +

" pts";

document
.getElementById(
"welcome"
)

.innerText =

"Bienvenido " +

p.display_name +

" · " +

p.badge;

}

loadProfile();

</script>

</body>

</html>
