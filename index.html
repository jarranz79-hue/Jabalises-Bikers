<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jabalises Bikers</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at top,#17233d,#07111f 60%);color:white;font-family:Arial;padding:22px}
.header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}
h1{margin:0;color:#f97316}
button,select{background:#f97316;color:white;border:0;border-radius:14px;padding:14px 20px;font-weight:bold}
.card{background:#111827;border:1px solid #1f2937;border-radius:24px;padding:22px;margin-bottom:16px}
.status,.small{color:#94a3b8}
.value{font-size:44px;font-weight:bold;color:#22c55e}
.layout{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.row{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid #1f2937}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.admin{background:#16a34a}
.strava{background:#fc4c02}
.gold{color:#facc15}
.silver{color:#cbd5e1}
.bronze{color:#fb923c}
@media(max-width:900px){
.layout{grid-template-columns:1fr}
.grid{grid-template-columns:1fr 1fr}
}
</style>
</head>

<body>

<div class="header">

<div>
<h1>🐗 Jabalises Bikers</h1>
<div id="status" class="status">Preparado</div>
</div>

<div class="actions">

<select id="seasonSelect"></select>

<button class="strava">
🚴 Conectar Strava
</button>

<button onclick="loadDashboard()">
🔄 Actualizar
</button>

<button
id="adminSyncBtn"
class="admin"
onclick="syncStrava()"
style="display:none">

👑 Actualizar Strava

</button>

</div>

</div>

<div class="layout">

<div>

<div class="card">

<h2>

🏆 Clasificación anual

</h2>

<div id="rankingList">

Cargando...

</div>

</div>

</div>

<div>

<div class="card">

<h2>

🐗 Podio

</h2>

<div id="podium">

Cargando...

</div>

</div>

</div>

</div>

<script>

const SUPABASE_URL=
"https://bktwylokqyjuoernembh.supabase.co";

const SUPABASE_KEY=
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJrdHd5bG9rcXlqdW9lcm5lbWJoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2NjAyMTAsImV4cCI6MjA5NTIzNjIxMH0.1AEpUCfoGn7-KYIU8tcQhmfLvd5Go6KyIBXTdp-9_vM";

const FUNCTION_URL=
"https://bktwylokqyjuoernembh.supabase.co/functions/v1/strava-auth";

const STRAVA_CLIENT_ID=
"250583";

let currentSeason=
new Date()
.getFullYear();

async function query(path){

const r=
await fetch(
SUPABASE_URL+
path,
{
headers:{
apikey:
SUPABASE_KEY,

Authorization:
"Bearer "+
SUPABASE_KEY
}
}
);

return r.json();

}

async function checkAdmin(){

const rows=
await query(
"/rest/v1/profiles?select=role&role=eq.admin&limit=1"
);

if(
rows.length
){

document
.getElementById(
"adminSyncBtn"
)
.style.display=
"block";

}

}

async function syncStrava(){

document
.getElementById(
"status"
)
.innerText=
"Sincronizando...";

const r=
await fetch(
SUPABASE_URL+
"/functions/v1/admin-sync-strava",
{
method:
"POST",

headers:{
apikey:
SUPABASE_KEY
}
}
);

const json=
await r.json();

document
.getElementById(
"status"
)
.innerText=

"✅ "+
json.synced+
" participantes";

await loadDashboard();

}

async function loadSeasons(){

const rows=
await query(
"/rest/v1/leaderboard_by_season?select=season"
);

const seasons=
[
...new Set(
rows.map(
r=>r.season
)
)
]
.sort()
.reverse();

const select=
document
.getElementById(
"seasonSelect"
);

select.innerHTML="";

seasons.forEach(

s=>{

const o=
document
.createElement(
"option"
);

o.value=s;

o.text=
"Temporada "+
s;

if(
s==
currentSeason
){

o.selected=true;

}

select.appendChild(
o
);

}

);

select.onchange=
()=>{

currentSeason=
Number(
select.value
);

loadDashboard();

};

}

function medal(pos){

if(pos===1)
return"🥇";

if(pos===2)
return"🥈";

if(pos===3)
return"🥉";

return"#"+pos;

}

async function loadDashboard(){

document
.getElementById(
"status"
)
.innerText=
"Cargando";

const rows=
await query(

"/rest/v1/leaderboard_by_season?season=eq."
+
currentSeason
+
"&select=*"

);

let ranking="";
let podium="";

rows.forEach(

r=>{

ranking+=
`
<div class=row>

<div>

${medal(r.position)}

${r.profile_name}

</div>

<div>

🏆
${r.total_points}

</div>

</div>
`;

if(
r.position<=3
){

podium+=
`
<div class=row>

<div>

${medal(r.position)}

${r.profile_name}

</div>

<div>

${r.total_points}

</div>

</div>
`;

}

}

);

document
.getElementById(
"rankingList"
)
.innerHTML=
ranking;

document
.getElementById(
"podium"
)
.innerHTML=
podium;

document
.getElementById(
"status"
)
.innerText=

"🟢 Dashboard cargado";

}

async function start(){

await checkAdmin();

await loadSeasons();

await loadDashboard();

}

start();

</script>

</body>

</html>
