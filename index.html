<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">

<title>
Jabalises Bikers
</title>

<style>

body{

background:#111827;

color:white;

font-family:Arial;

text-align:center;

padding:50px;

}

button{

padding:15px;

border:0;

border-radius:10px;

background:#22c55e;

color:white;

cursor:pointer;

}

</style>

</head>

<body>

<h1>

🏔️ Jabalises Bikers

</h1>

<p id="msg">

Preparado

</p>

<button
onclick="testFunction()">

Probar función

</button>

<script>

const FUNCTION_URL =
"https://bktwylokqyjuoernembh.supabase.co/functions/v1/strava-auth";

async function testFunction(){

document
.getElementById(
"msg"
)
.innerText =
"Probando...";

try{

const response =
await fetch(
FUNCTION_URL,
{

method:
"POST",

headers:{
"Content-Type":
"application/json"
},

body:
JSON.stringify({

code:
"prueba"

})

}

);

const data =
await response.json();

document
.getElementById(
"msg"
)
.innerText =
"✅ Función responde";

console.log(
data
);

}

catch(e){

document
.getElementById(
"msg"
)
.innerText =
"❌ Error función";

}

}

</script>

</body>

</html>
