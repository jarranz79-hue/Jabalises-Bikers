<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Jabalises Bikers</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
margin:0;
padding:24px;
background:#07111f;
color:white;
font-family:Arial;
}

h1{
color:#ff7a1a;
}

.card{
background:#10172f;
padding:24px;
border-radius:18px;
margin-top:18px;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:14px;
}

.value{
font-size:48px;
font-weight:bold;
color:#22c55e;
}

button{
background:#ff7a1a;
color:white;
border:0;
padding:14px 20px;
border-radius:12px;
}

.small{
color:#94a3b8;
}

#profile{
line-height:1.8;
font-size:20px;
}

</style>

</head>

<body>

<h1>

🐗 Jabalises Bikers

</h1>

<p id="status">

Preparado

</p>

<button onclick="loadDashboard()">

🔄 Actualizar

</button>

<div class="card">

<h2>

👤 Perfil

</h2>

<div id="profile">

Esperando perfil...

</div>

</div>

<div class="grid">

<div class="card">

🏆

<div id="points" class="value">

0

</div>

<p>

Puntos

</p>

</div>

<div class="card">

🚴

<div id="activities" class="value">

0

</div>

<p>

Salidas

</p>

</div>

<div class="card">

📍

<div id="km" class="value">

0

</div>

<p>

Kilómetros

</p>

</div>

<div class="card">

⛰️

<div id="elevation" class="value">

0

</div>

<p>

Desnivel

</p>

</div>

</div>

<script>

const SUPABASE_URL=
"https://bktwylokqyjuoernembh.supabase.co";

const SUPABASE_KEY=
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJrdHd5bG9rcXlqdW9lcm5lbWJoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2NjAyMTAsImV4cCI6MjA5NTIzNjIxMH0.1AEpUCfoGn7-KYIU8tcQhmfLvd5Go6KyIBXTdp-9_vM
";

const supabase=
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

async function loadDashboard(){

try{

document.getElementById(
"status"
).innerHTML=
"Cargando perfil...";

const profile=
await supabase

.from(
"profile_dashboard"
)

.select(
"*"
)

.limit(
1
);

if(
profile.error
){

throw profile.error;

}

if(
profile.data.length
){

const p=
profile.data[0];

document.getElementById(
"profile"
).innerHTML=

"🐗 <b>"+p.display_name+"</b><br>"+

"🏆 "+p.badge+"<br>"+

"🔥 Nivel "+p.level+"<br>"+

"⭐ "+p.total_points+" pts";

}

document.getElementById(
"status"
).innerHTML=

"Cargando ranking...";

const ranking=
await supabase

.from(
"leaderboard"
)

.select(
"*"
)

.limit(
1
);

if(
ranking.error
){

throw ranking.error;

}

if(
ranking.data.length
){

const r=
ranking.data[0];

document.getElementById(
"points"
).innerText=
r.total_points;

document.getElementById(
"activities"
).innerText=
r.activities;

document.getElementById(
"km"
).innerText=
Math.round(
r.total_km
);

document.getElementById(
"elevation"
).innerText=
Math.round(
r.total_elevation
);

}

document.getElementById(
"status"
).innerHTML=

"🟢 Dashboard cargado";

}

catch(e){

document.getElementById(
"status"
).innerHTML=

"❌ "+
e.message;

}

}

loadDashboard();

</script>

</body>

</html>
