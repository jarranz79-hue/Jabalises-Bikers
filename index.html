<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jabalises Bikers</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
  margin:0;
  background:#07111f;
  color:white;
  font-family:Arial;
  padding:24px;
}

.card{
  background:#111827;
  border-radius:20px;
  padding:22px;
  margin-bottom:18px;
}

h1{
  color:#f97316;
}

button{
  background:#f97316;
  color:white;
  border:0;
  border-radius:12px;
  padding:14px 18px;
  font-weight:bold;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.value{
  font-size:34px;
  font-weight:bold;
  color:#22c55e;
}

.small{
  color:#94a3b8;
}

.activity{
  border-bottom:1px solid #1f2937;
  padding:14px 0;
}
</style>
</head>

<body>

<h1>🐗 Jabalises Bikers</h1>

<p id="status" class="small">Preparado</p>

<button onclick="loadApp()">🔄 Actualizar</button>

<div class="card">
  <h2>👤 Perfil</h2>
  <p id="profile">Cargando perfil...</p>
</div>

<div class="grid">
  <div class="card">
    🏆
    <div id="points" class="value">0</div>
    <p class="small">Puntos</p>
  </div>

  <div class="card">
    🚴
    <div id="activities" class="value">0</div>
    <p class="small">Salidas</p>
  </div>

  <div class="card">
    📍
    <div id="km" class="value">0</div>
    <p class="small">Kilómetros</p>
  </div>

  <div class="card">
    ⛰️
    <div id="elevation" class="value">0</div>
    <p class="small">Desnivel</p>
  </div>
</div>

<div class="card">
  <h2>🚴 Actividades recientes</h2>
  <div id="recent"></div>
</div>

<script>
const SUPABASE_URL = "https://bktwylokqyjuoernembh.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJrdHd5bG9rcXlqdW9lcm5lbWJoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2NjAyMTAsImV4cCI6MjA5NTIzNjIxMH0.1AEpUCfoGn7-KYIU8tcQhmfLvd5Go6KyIBXTdp-9_vM";

const supabase = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

async function loadApp(){
  const status = document.getElementById("status");

  try{
    status.innerText = "Cargando perfil...";

    const profileResult = await supabase
      .from("profile_dashboard")
      .select("*")
      .limit(1);

    if(profileResult.error){
      throw new Error("Perfil: " + profileResult.error.message);
    }

    if(profileResult.data && profileResult.data.length > 0){
      const p = profileResult.data[0];

      document.getElementById("profile").innerHTML =
      "🐗 <strong>" + (p.display_name || "Jabalí") + "</strong><br>" +
      "🏆 " + (p.badge || "Sin insignia") + "<br>" +
      "🔥 Nivel " + (p.level || 1) + "<br>" +
      "⭐ " + (p.total_points || 0) + " pts";
    }

    status.innerText = "Cargando ranking...";

    const rankingResult = await supabase
      .from("weekly_ranking")
      .select("*")
      .limit(1);

    if(rankingResult.error){
      throw new Error("Ranking: " + rankingResult.error.message);
    }

    if(rankingResult.data && rankingResult.data.length > 0){
      const r = rankingResult.data[0];

      document.getElementById("points").innerText =
      Math.round(r.total_points || 0);

      document.getElementById("activities").innerText =
      r.activities || 0;

      document.getElementById("km").innerText =
      r.total_km || 0;

      document.getElementById("elevation").innerText =
      r.total_elevation || 0;
    }

    status.innerText = "Cargando actividades...";

    const recentResult = await supabase
      .from("recent_activities")
      .select("*");

    if(recentResult.error){
      throw new Error("Actividades: " + recentResult.error.message);
    }

    let html = "";

    if(recentResult.data){
      recentResult.data.forEach((a)=>{
        html +=
        "<div class='activity'>" +
        "<strong>" + (a.name || "Actividad") + "</strong><br>" +
        "<span class='small'>" +
        (a.distance_km || 0) + " km · " +
        (a.elevation_m || 0) + " m+ · " +
        "🏆 " + (a.points || 0) +
        "</span>" +
        "</div>";
      });
    }

    document.getElementById("recent").innerHTML = html;

    status.innerText = "🟢 App cargada correctamente";
  }

  catch(error){
    status.innerText = "❌ " + error.message;
  }
}

loadApp();
</script>

</body>
</html>
