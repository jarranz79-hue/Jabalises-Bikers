<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jabalises Bikers</title>

<style>
*{
box-sizing:border-box
}

body{
margin:0;
font-family:Arial;
background:
radial-gradient(circle at top,#17233d,#07111f 60%);
color:white;
padding:24px;
}

.card{
background:#111827;
border:1px solid #1f2937;
border-radius:24px;
padding:24px;
max-width:700px;
margin:auto;
}

h1{
margin-top:0;
color:#f97316;
}

button{
background:#fc4c02;
color:white;
border:0;
padding:16px 22px;
border-radius:14px;
font-weight:bold;
cursor:pointer;
font-size:16px;
}

#status{
margin-top:20px;
color:#94a3b8;
}

.row{
padding:14px 0;
border-bottom:1px solid #1f2937;
}

.green{
color:#22c55e;
}
</style>
</head>

<body>

<div class="card">

<h1>

🐗 Jabalises Bikers

</h1>

<button onclick="connectStrava()">

🚴 Conectar Strava

</button>

<div id="status">

Esperando conexión...

</div>

<div id="result">

</div>

</div>

<script>

const SUPABASE_URL =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJrdHd5bG9rcXlqdW9lcm5lbWJoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2NjAyMTAsImV4cCI6MjA5NTIzNjIxMH0.1AEpUCfoGn7-KYIU8tcQhmfLvd5Go6KyIBXTdp-9_vM";

const SUPABASE_KEY =
"https://bktwylokqyjuoernembh.supabase.co";

const FUNCTION_URL =
"https://bktwylokqyjuoernembh.supabase.co/functions/v1/strava-auth";

const STRAVA_CLIENT_ID =
"250583";
const REDIRECT_URL ="https://jarranz79-hue.github.io/Jabalises-Bikers/";

function connectStrava(){

const url =

"https://www.strava.com/oauth/authorize"

+

"?client_id=" +
STRAVA_CLIENT_ID

+

"&response_type=code"

+

"&redirect_uri=" +
encodeURIComponent(
REDIRECT_URL
)

+

"&approval_prompt=force"

+

"&scope=read,activity:read_all";

window.location.href =
url;

}

async function importFromStrava(code){

const response =
await fetch(
FUNCTION_URL,
{
method:"POST",

headers:{
"Content-Type":
"application/json",

apikey:
SUPABASE_KEY,

Authorization:
"Bearer " +
SUPABASE_KEY
},

body:
JSON.stringify({code})
}
);

return await response.json();

}

async function start(){

const params =
new URLSearchParams(
window.location.search
);

const code =
params.get("code");

if(!code){
return;
}

document
.getElementById(
"status"
)
.innerText =
"Importando actividades desde Strava...";

try{

const result =
await importFromStrava(
code
);

if(!result.ok){

throw new Error(
JSON.stringify(result)
);

}

document
.getElementById(
"status"
)
.innerHTML =

"<span class='green'>"

+

"✅ Conectado correctamente"

+

"</span>";

document
.getElementById(
"result"
)
.innerHTML =

"<div class='row'>👤 "

+

result.athlete

+

"</div>"

+

"<div class='row'>🚴 Actividades importadas: "

+

result.imported

+

"</div>"

+

"<div class='row'>🏆 Puntos "

+

result.current_year

+

": "

+

result.current_year_points

+

"</div>";

window.history.replaceState(
{},
document.title,
REDIRECT_URL
);

}
catch(error){

document
.getElementById(
"status"
)
.innerHTML =

"❌ " +
error.message;

}

}

start();

</script>

</body>
</html>
